<div class="bg-white rounded-lg border border-stone-200 shadow-sm p-4 sm:p-6">
  <!-- Header / Navigation -->
  <div class="flex items-center justify-between mb-4">
    <button
      (click)="prevMonth()"
      class="p-2 rounded-lg hover:bg-stone-100 text-stone-600 transition-colors"
      aria-label="Previous month"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
      </svg>
    </button>

    <h3 class="text-lg font-semibold text-stone-800">
      {{ monthName() }} {{ currentYear() }}
    </h3>

    <button
      (click)="nextMonth()"
      class="p-2 rounded-lg hover:bg-stone-100 text-stone-600 transition-colors"
      aria-label="Next month"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
      </svg>
    </button>
  </div>

  <!-- Weekday Headers -->
  <div class="grid grid-cols-7 gap-1 mb-1">
    @for (day of weekDays; track day) {
      <div class="text-center text-xs font-medium text-stone-500 py-1">
        {{ day }}
      </div>
    }
  </div>

  <!-- Calendar Grid -->
  <div class="grid grid-cols-7 gap-1">
    @for (cell of calendarDays(); track $index) {
      @if (cell === null) {
        <div class="h-14 sm:h-16"></div>
      } @else {
        <button
          (click)="onDayClick(cell)"
          [disabled]="!cell.isAvailable || cell.isPast"
          class="h-14 sm:h-16 rounded-lg text-center flex flex-col items-center justify-center text-sm transition-all duration-150 relative"
          [class]="
            cell.isCheckIn || cell.isCheckOut
              ? 'bg-amber-100 border-2 border-amber-500 text-amber-800 font-bold'
              : cell.isInRange
                ? 'bg-amber-50 border border-amber-200 text-amber-700'
                : cell.isPast
                  ? 'bg-stone-50 text-stone-300 cursor-not-allowed'
                  : cell.isAvailable
                    ? 'bg-white hover:bg-stone-50 text-stone-800 cursor-pointer'
                    : 'bg-stone-50 text-stone-300 line-through cursor-not-allowed'
          "
          [title]="cell.minimumStay ? 'Min stay: ' + cell.minimumStay + ' nights' : ''"
        >
          <span class="leading-none">{{ cell.day }}</span>

          @if (cell.isAvailable && cell.price != null && !cell.isPast) {
            <span class="text-[10px] text-stone-500 font-medium leading-none mt-0.5">
              ${{ cell.price }}
            </span>
          }

          @if (cell.minimumStay && cell.isAvailable && !cell.isPast) {
            <span class="text-[8px] text-stone-400 leading-none mt-0.5">
              {{ cell.minimumStay }}n min
            </span>
          }
        </button>
      }
    }
  </div>

  <!-- Legend -->
  <div class="mt-4 flex flex-wrap gap-4 text-xs text-stone-500">
    <div class="flex items-center gap-1.5">
      <span class="w-3 h-3 rounded bg-white border border-stone-200"></span>
      Available
    </div>
    <div class="flex items-center gap-1.5">
      <span class="w-3 h-3 rounded bg-stone-50 border border-stone-200"></span>
      Unavailable
    </div>
    <div class="flex items-center gap-1.5">
      <span class="w-3 h-3 rounded bg-amber-100 border-2 border-amber-500"></span>
      Selected
    </div>
  </div>
</div>
