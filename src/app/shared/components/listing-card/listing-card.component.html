<a
  [routerLink]="['/listings', listing().listingId]"
  class="group block rounded-xl bg-white shadow-sm hover:shadow-lg transition-all duration-300 overflow-hidden"
>
  <!-- Thumbnail -->
  <div class="overflow-hidden">
    @if (listing().thumbnailUrl) {
      <img
        [src]="listing().thumbnailUrl"
        [alt]="listing().name"
        class="w-full aspect-[4/3] object-cover transition-transform duration-500 group-hover:scale-105"
      />
    } @else {
      <div
        class="w-full aspect-[4/3] bg-gradient-to-br from-stone-100 to-stone-200 flex items-center justify-center"
      >
        <svg
          class="w-12 h-12 text-stone-300"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="1.5"
            d="M3 9.75L12 3l9 6.75V21a1.5 1.5 0 01-1.5 1.5h-15A1.5 1.5 0 013 21V9.75z"
          />
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="1.5"
            d="M9 22.5V12h6v10.5"
          />
        </svg>
      </div>
    }
  </div>

  <!-- Card Body -->
  <div class="p-5">
    <h3 class="text-base font-bold text-stone-800 group-hover:text-amber-600 transition-colors line-clamp-1">
      {{ listing().name }}
    </h3>

    @if (listing().city || listing().country) {
      <p class="mt-1.5 text-sm text-stone-400 flex items-center gap-1">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M17.657 16.657L13.414 20.9a2 2 0 01-2.828 0l-4.243-4.243a8 8 0 1111.314 0z"
          />
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"
          />
        </svg>
        <span>
          {{ listing().city }}@if (listing().city && listing().country) {<span>, </span>}{{ listing().country }}
        </span>
      </p>
    }

    <div class="mt-4 flex items-center justify-between border-t border-stone-100 pt-4">
      @if (listing().maxGuests) {
        <span class="text-xs text-stone-400 font-medium flex items-center gap-1">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"
            />
          </svg>
          Up to {{ listing().maxGuests }}
        </span>
      }

      <span
        class="inline-flex items-center gap-1 text-xs font-bold uppercase tracking-wide text-amber-600 group-hover:text-amber-700 transition-colors"
      >
        View
        <svg class="w-3.5 h-3.5 transition-transform group-hover:translate-x-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
        </svg>
      </span>
    </div>
  </div>
</a>
