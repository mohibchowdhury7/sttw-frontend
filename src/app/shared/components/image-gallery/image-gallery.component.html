@if (hasImages()) {
  <!-- Main Image -->
  <div class="relative rounded-lg overflow-hidden group">
    <img
      [src]="currentImage()"
      alt="Gallery image"
      class="w-full h-80 sm:h-96 object-cover transition-opacity duration-300"
    />

    <!-- Prev Button -->
    @if (totalImages() > 1) {
      <button
        (click)="prev()"
        class="absolute left-3 top-1/2 -translate-y-1/2 bg-white/80 hover:bg-white backdrop-blur-sm text-stone-800 rounded-lg p-2 shadow-sm opacity-0 group-hover:opacity-100 transition-opacity duration-200"
        aria-label="Previous image"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
        </svg>
      </button>

      <!-- Next Button -->
      <button
        (click)="next()"
        class="absolute right-3 top-1/2 -translate-y-1/2 bg-white/80 hover:bg-white backdrop-blur-sm text-stone-800 rounded-lg p-2 shadow-sm opacity-0 group-hover:opacity-100 transition-opacity duration-200"
        aria-label="Next image"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
        </svg>
      </button>
    }

    <!-- Image Counter -->
    <div
      class="absolute bottom-3 right-3 bg-black/60 text-white text-xs font-medium px-2.5 py-1 rounded-lg backdrop-blur-sm"
    >
      {{ currentIndex() + 1 }} / {{ totalImages() }}
    </div>
  </div>

  <!-- Thumbnail Strip -->
  @if (totalImages() > 1) {
    <div class="mt-3 flex gap-2 overflow-x-auto scroll-smooth snap-x snap-mandatory pb-2">
      @for (image of images(); track $index) {
        <button
          (click)="selectImage($index)"
          class="flex-shrink-0 snap-start rounded-lg overflow-hidden border-2 transition-all duration-200"
          [class]="
            $index === currentIndex()
              ? 'border-amber-500 shadow-sm'
              : 'border-transparent opacity-60 hover:opacity-100'
          "
        >
          <img
            [src]="image"
            alt="Thumbnail"
            class="w-16 h-16 sm:w-20 sm:h-20 object-cover"
          />
        </button>
      }
    </div>
  }
} @else {
  <!-- No Images Placeholder -->
  <div
    class="w-full h-80 sm:h-96 rounded-lg bg-stone-100 flex flex-col items-center justify-center"
  >
    <svg class="w-16 h-16 text-stone-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="1.5"
        d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"
      />
    </svg>
    <p class="mt-2 text-sm font-medium text-stone-500">No images available</p>
  </div>
}
