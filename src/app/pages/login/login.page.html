<!-- Page Header -->
<section class="border-b border-stone-200 bg-stone-50 py-10">
  <div class="mx-auto max-w-md px-4 text-center">
    <p class="mb-1 text-sm font-semibold uppercase tracking-widest text-amber-600">Welcome back</p>
    <h1 class="text-3xl font-extrabold tracking-tight text-stone-800">Log In</h1>
    <p class="mt-1 text-stone-500">Sign in to manage your bookings</p>
  </div>
</section>

<section class="mx-auto max-w-md px-4 py-10">
  <div class="rounded-2xl bg-white p-6 shadow-sm ring-1 ring-stone-200 sm:p-8">
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-5">
      <!-- Email -->
      <div>
        <label for="email" class="mb-1.5 block text-sm font-medium text-stone-700">
          Email <span class="text-red-500">*</span>
        </label>
        <input
          id="email"
          type="email"
          formControlName="email"
          class="w-full rounded-xl border border-stone-300 px-4 py-3 text-stone-800 transition focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20 focus:outline-none"
          [class.border-red-400]="isFieldInvalid('email')"
          placeholder="you@example.com"
        />
        @if (isFieldInvalid('email')) {
          <p class="mt-1 text-sm text-red-500">{{ getFieldError('email') }}</p>
        }
      </div>

      <!-- Password -->
      <div>
        <label for="password" class="mb-1.5 block text-sm font-medium text-stone-700">
          Password <span class="text-red-500">*</span>
        </label>
        <input
          id="password"
          type="password"
          formControlName="password"
          class="w-full rounded-xl border border-stone-300 px-4 py-3 text-stone-800 transition focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20 focus:outline-none"
          [class.border-red-400]="isFieldInvalid('password')"
          placeholder="Your password"
        />
        @if (isFieldInvalid('password')) {
          <p class="mt-1 text-sm text-red-500">{{ getFieldError('password') }}</p>
        }
      </div>

      <!-- Error Message -->
      @if (submitError()) {
        <div class="rounded-xl border border-red-200 bg-red-50 p-4 text-sm text-red-600">
          {{ submitError() }}
        </div>
      }

      <!-- Submit Button -->
      <button
        type="submit"
        [disabled]="submitting()"
        class="inline-flex w-full items-center justify-center gap-2 rounded-xl bg-amber-500 px-8 py-4 text-lg font-semibold text-white shadow-sm transition-all hover:bg-amber-600 hover:shadow-md disabled:opacity-60"
      >
        @if (submitting()) {
          <svg class="h-5 w-5 animate-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
          </svg>
          Signing in...
        } @else {
          Log In
        }
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-stone-500">
      Don't have an account?
      <a routerLink="/signup" class="font-semibold text-amber-600 hover:text-amber-700 transition-colors">
        Sign up
      </a>
    </p>
  </div>
</section>
